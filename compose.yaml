# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  postgres:
    image: postgres:latest
    container_name: ${COMPOSE_PROJECT_NAME:-app}_postgres #
    environment:
      POSTGRES_USER: ${DB_USER} #
      POSTGRES_PASSWORD: ${DB_PASSWORD} #
      POSTGRES_DB: ${DB_NAME} #
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # command: > # пока так
    #   postgres -c max_connections=1000 
    #            -c shared_buffers=128MB 
    #            -c effective_cache_size=768MB
    #            -c maintenance_work_mem=64MB
    #            -c checkpoint_completion_target=0.7
    #            -c wal_buffers=16MB
    #            -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  app:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-app}_backend
    environment:
      DB_USER: ${DB_USER}           
      DB_PASSWORD: ${DB_PASSWORD}   
      DB_NAME: ${DB_NAME}           
      DB_HOST: postgres             
      DB_PORT: 5432
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"
    volumes:
    - .:/app  # монтирует текущую директорию в /app внутри контейнера
    # Команда для обращения к локальной папке storage_data и подключение её 
    # в папку /app/storage внутри контейнера бэкенда
    - ./storage:/app/storage 
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # включает авто-перезагрузку при изменениях
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    
  frontend:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-app}_frontend
    environment:
      # Внутри Docker сеть общая, поэтому обращаемся к сервису 'app' по порту 8000
      API_BASE: "http://app:8000" 
    ports:
      - "8501:8501" 
    volumes:
    - .:/app # Монтируем весь код, чтобы видеть изменения сразу
    depends_on:
      - app 
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0 --server.enableCORS=false --server.enableXsrfProtection=false
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

# В файле frontend/utils.py есть строка: API_BASE = get_secret("API_BASE", "http://127.0.0.1:8000")
# Благодаря строчке environment: API_BASE: "http://app:8000" в compose.yaml, Python внутри контейнера 
# фронтенда увидит переменную окружения и будет слать запросы не на локалхост контейнера (где пусто), 
# а на соседний контейнер с бэкендом. Это будет работать автоматически.

# ----------------------
# Когда запускается streamlit run локально на своем Mac, программа имеет доступ к вашей операционной системе и может отправить команду "открой Chrome".
# При запуске приложения в Docker оно работает внутри изолированного контейнера 
# (по сути, виртуального сервера без монитора). У этого "сервера" нет доступа к рабочему столу, 
# и он не может открыть браузер самостоятельно. Поэтому переходить по ссылке http://localhost:8501 
# нужно вручную.

