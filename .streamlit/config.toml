[theme]
primaryColor = "#8A4FFF"           # Яркий фиолетовый
backgroundColor = "#F9F7FF"        # Светло-лавандовый фон
secondaryBackgroundColor = "#FFFFFF" # Белый для карточек
textColor = "#3C3744"              # Темно-серый с фиолетовым оттенком
font = "sans serif"

# Дополнительные настройки темы
base = "light"

# Акцентные цвета
[theme.accent]
background = "#B19CD9"             # Пастельно-фиолетовый
text = "#8A4FFF"                   # Яркий фиолетовый

# Кастомные цвета (не все поддерживаются Streamlit напрямую, но можно использовать через CSS)
[theme.custom]
sidebarBackground = "#E6E0FF"      # Светло-лавандовый для сайдбара
cardShadow = "0 4px 6px rgba(0,0,0,0.1)"
borderRadius = "10px"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[client]
toolbarMode = "viewer"
showErrorDetails = false

# Опционально: настройки для мобильных устройств
[browser]
gatherUsageStats = false